<!doctype html>
<!--
  Captures prototype source of truth.
      Every future capture prototype belongs in this file as an in-page mode or
      state. Do not create a sibling prototype HTML file; extend this document,
      preserve its Apple-native visual language, and keep the interaction real.
      Capture rectangles must be drawn by the user; never replace them with a
      hard-coded default rectangle.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Captures · All in One 原型</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --secondary: #6e6e73;
      --selection-corner: rgba(31,31,33,.92);
      --selection-corner-contrast: rgba(255,255,255,.96);
      --tertiary: #86868b;
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.94);
      --line: rgba(29, 29, 31, 0.14);
      --line-strong: rgba(29, 29, 31, 0.22);
      --blue: #007aff;
      --blue-soft: rgba(0, 122, 255, 0.12);
      --green: #34c759;
      --prototype-switcher-height: 52px;
      --titlebar-height: 40px;
      --frame-left: 7.3%;
      --frame-top: 8.5%;
      --frame-width: 85.4%;
      --frame-height: 76%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-width: 0; height: 100%; min-height: 0; overflow: hidden; }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: #f5f5f7;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .prototype {
      width: 100%;
      height: calc(100vh - var(--prototype-switcher-height));
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      position: relative;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #f5f5f7;
      box-shadow: none;
    }

    .prototype-switcher-bar {
      flex: 0 0 var(--prototype-switcher-height);
      height: var(--prototype-switcher-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(29,29,31,.10);
      background: rgba(245,245,247,.96);
    }

    .desktop-bar {
      height: var(--titlebar-height);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      position: relative;
      z-index: 40;
      padding: 0 14px;
      color: rgba(29,29,31,.68);
      font-size: 11px;
      border-bottom: 1px solid rgba(29,29,31,.08);
      background: rgba(248,248,250,.92);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
    }

    .desktop-left { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; }
    .desktop-app { color: var(--ink); font-size: 11px; font-weight: 600; }

    .traffic-lights { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; }
    .traffic-lights i { width: 12px; height: 12px; display: block; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
    .traffic-lights i:nth-child(1) { background: #ff5f57; }
    .traffic-lights i:nth-child(2) { background: #febc2e; }
    .traffic-lights i:nth-child(3) { background: #28c840; }

    .mode-switch {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      padding: 3px;
      border: 1px solid rgba(29,29,31,.11);
      border-radius: 10px;
      background: rgba(118,118,128,.10);
      box-shadow: 0 1px 0 rgba(255,255,255,.64) inset;
    }

    .mode-switch button {
      min-width: 96px;
      min-height: 26px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -.01em;
      transition: background .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .mode-switch button:hover:not([aria-selected="true"]) { background: rgba(255,255,255,.42); color: var(--ink); }
    .mode-switch button:active { transform: scale(.985); }
    .mode-switch button[aria-selected="true"] {
      background: rgba(255,255,255,.96);
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(29,29,31,.14), 0 0 0 .5px rgba(29,29,31,.07);
    }

    .mode-switch button:focus-visible,
    .editor-command-tabs button:focus-visible,
    .editor-action:focus-visible {
      outline: 3px solid rgba(0,122,255,.28);
      outline-offset: 1px;
    }

    .prototype-nav { display: none; }

    .scene {
      position: absolute;
      inset: var(--titlebar-height) 0 0;
      overflow: hidden;
      background: #fff;
    }

    .editor-workspace,
    .scroll-workspace,
    .pin-workspace {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(5px) scale(.998);
      transform-origin: 50% 46%;
      z-index: 1;
    }

    .prototype[data-ready="true"] .editor-workspace,
    .prototype[data-ready="true"] .scroll-workspace,
    .prototype[data-ready="true"] .pin-workspace {
      transition:
        opacity .14s ease,
        transform .18s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear 0s;
    }

    .editor-workspace {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #f5f5f7;
    }

    .scroll-workspace {
      display: block;
    }

    .pin-workspace {
      display: block;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(0,122,255,.13), transparent 30%),
        linear-gradient(145deg, #e8edf5 0%, #dce3ed 48%, #d4dbe5 100%);
    }

    #prototype[data-page="editor"] [data-page-pane="editor"],
    #prototype[data-page="scroll"] [data-page-pane="scroll"],
    #prototype[data-page="pin"] [data-page-pane="pin"] {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition-delay: 0s;
      z-index: 2;
    }

    .editor-action-template { display: none; }

    .editor-command-slot {
      flex: 1 1 auto;
      align-self: stretch;
      min-width: 0;
      overflow: hidden;
    }

    #prototype:not([data-page="editor"]) .editor-command-slot { display: none; }

    .editor-command-bar {
      height: var(--titlebar-height);
      align-items: center;
      display: flex;
      min-width: 0;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .editor-command-tabs,
    .editor-command-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
    }

    .editor-command-actions { flex: 0 0 auto; margin-left: auto; }

    .editor-command-tabs {
      gap: 3px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .editor-zoom-controls {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      margin-right: 4px;
      padding-right: 7px;
      border-right: 1px solid rgba(29,29,31,.12);
    }

    .editor-command-tabs button {
      height: 27px;
      min-width: 58px;
      padding: 0 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .editor-command-tabs button:hover:not([aria-selected="true"]) { background: rgba(255,255,255,.46); color: var(--ink); }
    .editor-command-tabs button[aria-selected="true"] {
      background: rgba(255,255,255,.96);
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(29,29,31,.12), 0 0 0 .5px rgba(29,29,31,.06);
    }

    .editor-command-divider { width: 1px; height: 18px; margin: 0 4px; background: rgba(29,29,31,.12); }

    .editor-action {
      min-height: 26px;
      padding: 0 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #007aff;
      cursor: pointer;
      font-size: 9px;
      white-space: nowrap;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .editor-action:hover { background: rgba(0,122,255,.09); }
    .editor-action:active { transform: scale(.98); }
    .editor-action.subtle { color: var(--secondary); }
    .editor-action.primary { padding: 0 10px; background: #007aff; color: #fff; }
    .editor-action.primary:hover { background: #168cff; }
    .editor-action.icon { min-width: 24px; padding: 0 5px; font-size: 15px; line-height: 1; }
    .editor-action.fit { padding: 0 6px; color: var(--secondary); }

    .editor-host {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      position: relative;
      padding: 0;
    }

    .editor-shell {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .editor-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 0;
      color: var(--secondary);
      background: #f5f5f7;
      font-size: 12px;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .editor-host:has(> .FIE_root) .editor-loading { opacity: 0; }

    .editor-host > .FIE_root {
      width: 100% !important;
      height: 100% !important;
    }

    .editor-toast {
      position: absolute;
      left: 50%;
      bottom: 22px;
      z-index: 30;
      transform: translate(-50%, 10px);
      padding: 8px 12px;
      border-radius: 9px;
      background: rgba(29,29,31,.84);
      color: #fff;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .editor-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    .source-window {
      position: absolute;
      inset: 26px 30px 112px;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(29,29,31,.16);
      background: #fff;
      box-shadow: 0 12px 36px rgba(30,38,52,.14);
    }

    .source-page {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #fff;
    }

    .source-page img {
      display: block;
      width: 100%;
      height: auto;
      transform: translateY(0);
      transition: transform 110ms ease-out;
      user-select: none;
      pointer-events: none;
    }

    .page-chrome {
      height: 34px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: rgba(255,255,255,.76);
      border-bottom: 1px solid rgba(29,29,31,.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--tertiary);
      font-size: 11px;
      pointer-events: none;
    }

    .page-chrome .traffic-lights { display: flex; gap: 5px; margin-right: 4px; }
    .page-chrome .traffic-lights i { width: 8px; height: 8px; border-radius: 50%; display: block; }
    .page-chrome .traffic-lights i:nth-child(1) { background: #ff5f57; }
    .page-chrome .traffic-lights i:nth-child(2) { background: #febc2e; }
    .page-chrome .traffic-lights i:nth-child(3) { background: #28c840; }
    .address-pill {
      min-width: 260px;
      height: 22px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-radius: 7px;
      background: rgba(29,29,31,.06);
      color: rgba(29,29,31,.5);
    }

    .selection-dim {
      position: absolute;
      z-index: 5;
      inset: 0;
      pointer-events: none;
      /* The selection window's outside box-shadow is the mask. Keeping a
         second full-screen fill here would dim the captured content twice. */
      background: transparent;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .selection-window {
      position: absolute;
      z-index: 6;
      left: var(--frame-left);
      top: var(--frame-top);
      width: var(--frame-width);
      height: var(--frame-height);
      border: 0;
      border-radius: 9px;
      box-shadow: 0 0 0 9999px rgba(17,21,28,.34);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: box-shadow .25s ease, opacity .18s ease;
    }

    .source-window.has-selection .selection-window {
      opacity: 1;
      visibility: visible;
    }

    .source-window:not(.has-selection) { cursor: crosshair; }
    .source-window.is-dragging { cursor: crosshair; }

    .selection-window.done { box-shadow: 0 0 0 9999px rgba(17,21,28,.2); }

    /* Four transparent pointer shields cover only the dimmed surroundings.
       The center remains open so manual scrolling can reach the selected page. */
    .scroll-input-shield {
      position: absolute;
      z-index: 5;
      display: none;
      background: transparent;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
    }
    .corner svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      shape-rendering: geometricPrecision;
    }
    .corner path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .corner .corner-contrast { stroke: var(--selection-corner-contrast); stroke-width: 8; }
    .corner .corner-primary { stroke: var(--selection-corner); stroke-width: 6; }
    .corner.tl { left: -4px; top: -4px; }
    .corner.tr { right: -4px; top: -4px; transform: scaleX(-1); }
    .corner.bl { left: -4px; bottom: -4px; transform: scaleY(-1); }
    .corner.br { right: -4px; bottom: -4px; transform: scale(-1); }

    .frame-caption {
      position: absolute;
      left: 12px;
      top: -31px;
      display: none;
      align-items: center;
      gap: 7px;
      height: 24px;
      padding: 0 9px;
      border-radius: 7px;
      background: rgba(29,29,31,.86);
      color: #fff;
      font-size: 11px;
      letter-spacing: .01em;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .frame-caption .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .capturing .frame-caption .dot { animation: pulse 1.3s ease-in-out infinite; }
    .done .frame-caption .dot { background: #36c66b; animation: none; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.78); } 50% { opacity: 1; transform: scale(1); } }

    .selection-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 7;
      transform: translate(-50%, -50%);
      padding: 11px 16px;
      border-radius: 11px;
      background: rgba(29,29,31,.82);
      color: #fff;
      font-size: 13px;
      letter-spacing: .01em;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }

    .has-selection .selection-hint, .capturing .selection-hint, .done .selection-hint { opacity: 0; transform: translate(-50%, -45%); }

    .control-panel {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(690px, calc(100% - 72px));
      padding: 12px 14px 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 12px 36px rgba(30,38,52,.2), 0 1px 0 rgba(255,255,255,.85) inset;
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
    }

    .panel-main { min-width: 0; flex: 1; }
    .panel-eyebrow { display: flex; align-items: center; gap: 7px; color: var(--secondary); font-size: 11px; margin-bottom: 3px; }
    .panel-eyebrow .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
    .done .panel-eyebrow .live-dot { background: var(--green); }
    .panel-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .panel-subtitle { margin-top: 3px; color: var(--secondary); font-size: 12px; }
    .panel-subtitle strong { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

    .panel-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    #prototype[data-state="capturing"] #startButton,
    #prototype[data-state="done"] #startButton { display: none; }
    #prototype[data-state="capturing"] .scroll-workspace > .control-panel,
    #prototype[data-state="done"] .scroll-workspace > .control-panel { display: none; }
    .action {
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid rgba(29,29,31,.14);
      border-radius: 10px;
      background: rgba(255,255,255,.56);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background .15s ease, transform .15s ease, border-color .15s ease;
    }
    .action:hover { background: rgba(255,255,255,.9); border-color: rgba(29,29,31,.23); }
    .action:active { transform: scale(.98); }
    .action:disabled { cursor: not-allowed; opacity: .48; box-shadow: none; }
    .action.primary { color: #fff; border-color: transparent; background: var(--blue); box-shadow: 0 2px 5px rgba(0,113,227,.2); }
    .action.primary:hover { background: #0077ed; }
    .action.ghost { display: none; }
    .capturing .action.start, .done .action.start { display: none; }
    .capturing .action.ghost { display: inline-flex; align-items: center; }
    .done .action.ghost { display: none; }
    .done .action.primary { background: rgba(29,29,31,.08); color: var(--ink); box-shadow: none; }

    .state-legend {
      position: absolute;
      z-index: 11;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 7px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 10px;
      background: rgba(255,255,255,.62);
      box-shadow: 0 5px 20px rgba(30,38,52,.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .state-legend button {
      border: 0;
      padding: 5px 9px;
      border-radius: 8px;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
      font-size: 11px;
    }
    .state-legend button.active { background: rgba(255,255,255,.9); color: var(--ink); box-shadow: 0 1px 3px rgba(29,29,31,.1); }

    .helper {
      position: absolute;
      left: 30px;
      bottom: 30px;
      z-index: 2;
      color: rgba(29,29,31,.42);
      font-size: 11px;
    }

    .pin-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .pin-source {
      position: absolute;
      inset: 42px 11% 82px;
      overflow: hidden;
      border: 1px solid rgba(29,29,31,.15);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 16px 42px rgba(35,46,64,.18);
    }

    .pin-source img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 9%;
      user-select: none;
      pointer-events: none;
    }

    .pin-source-chrome {
      position: absolute;
      inset: 0 0 auto;
      z-index: 1;
      height: 30px;
      display: flex;
      align-items: center;
      padding: 0 11px;
      background: rgba(255,255,255,.76);
      border-bottom: 1px solid rgba(29,29,31,.08);
      color: rgba(29,29,31,.48);
      font-size: 11px;
      pointer-events: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .pin-selection {
      position: absolute;
      z-index: 7;
      display: none;
      border: 0;
      border-radius: 9px;
      box-shadow: 0 0 0 9999px rgba(20,26,35,.30);
      pointer-events: none;
    }

    .pin-workspace.is-selecting .pin-source { cursor: crosshair; }
    .pin-workspace.is-selecting .floating-capture { pointer-events: none; opacity: .26; }
    .pin-workspace.is-selecting .pin-selection.is-visible { display: block; }

    .pin-selection.is-committed {
      display: block;
      box-shadow: 0 0 0 9999px rgba(20,26,35,.27);
    }

    .post-capture-chooser[hidden] { display: none; }

    .post-capture-chooser {
      --chooser-lens-x: 3px;
      --chooser-lens-opacity: 0;
      position: absolute;
      z-index: 42;
      width: 135px;
      height: 34px;
      padding: 3px;
      display: grid;
      grid-template-columns: repeat(4, 30px);
      gap: 3px;
      overflow: visible;
      border: 1px solid rgba(29,29,31,.24);
      border-radius: 12px;
      background: rgba(248,249,251,.92);
      box-shadow:
        0 12px 28px rgba(15,23,34,.24),
        0 1px 0 rgba(255,255,255,.95) inset,
        0 0 0 1px rgba(29,29,31,.08);
      backdrop-filter: blur(22px) saturate(135%);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
      opacity: 0;
      transform: translateY(4px) scale(.96);
      transform-origin: 82% 0;
      transition:
        opacity .14s ease,
        transform .2s cubic-bezier(.2,.85,.2,1);
      isolation: isolate;
    }

    .post-capture-chooser.has-scroll-capture {
      width: 168px;
      grid-template-columns: repeat(5, 30px);
    }

    .post-capture-chooser.scroll-result-chooser {
      width: 168px;
      grid-template-columns: repeat(5, 30px);
    }

    .post-capture-chooser.area-result-chooser {
      width: max-content;
      max-width: calc(100% - 20px);
      height: auto;
      min-height: 34px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      border-radius: 12px;
    }

    .area-result-chooser::before { display: none; }
    .post-capture-chooser.area-result-chooser[hidden] { display: none; }
    .area-result-chooser .post-capture-action { flex: 0 0 30px; }

          } else {
            const hit = [...marks].reverse().find((mark) => insideRect(point, markBounds(mark), 8));
            selectedMark = hit?.id || null;
            if (hit) markupGesture = { pointerId: event.pointerId, start: point, before: copyMarks(), moving: hit.id };
          }
          renderMarkup();
          if (markupGesture?.movingCrop) markupCanvas.style.cursor = 'grabbing';
        } else {
          const draft = { id: nextMarkID++, type: quickTool, start: point, end: point, color: colorInput.value, width: +widthInput.value };
          if (quickTool === 'pencil') draft.points = [point];
          markupGesture = { pointerId: event.pointerId, start: point, draft };
        }
        if (markupGesture) markupCanvas.setPointerCapture(event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      });
      markupCanvas.addEventListener('pointermove', (event) => {
        if (!pendingSelection) return;
        const point = markupPoint(event);
        if (!markupGesture) {
          const edges = canAdjustCrop() && insideRect(point, pendingSelection, 12) ? cropEdges(point) : null;
          markupCanvas.style.cursor = edges
            ? (cropResizeCursor(edges) || defaultMarkupCursor())
            : (canMoveCropWithSelectionTool() && insideRect(point, pendingSelection) ? 'grab' : defaultMarkupCursor());
          return;
        }
        if (event.pointerId !== markupGesture.pointerId) return;
        const dx = point.x - markupGesture.start.x;
        const dy = point.y - markupGesture.start.y;
        if (markupGesture.movingCrop) {
          const rect = markupGesture.rect;
          pendingSelection = {
            x: clamp(rect.x + dx, 0, frozenSize.width - rect.width),
            y: clamp(rect.y + dy, 0, frozenSize.height - rect.height),
            width: rect.width,
            height: rect.height,
          };
          showSelection(pendingSelection);
          showChooser(pendingSelection);
        } else if (markupGesture.rect) {
          const rect = markupGesture.rect;
          const edges = markupGesture.edges;
          const left = edges.left ? clamp(rect.x + dx, 0, rect.x + rect.width - minimumSize.width) : rect.x;
          const top = edges.top ? clamp(rect.y + dy, 0, rect.y + rect.height - minimumSize.height) : rect.y;
          const right = edges.right ? clamp(rect.x + rect.width + dx, left + minimumSize.width, frozenSize.width) : rect.x + rect.width;
          const bottom = edges.bottom ? clamp(rect.y + rect.height + dy, top + minimumSize.height, frozenSize.height) : rect.y + rect.height;
          pendingSelection = { x: left, y: top, width: right - left, height: bottom - top };
          showSelection(pendingSelection);
          showChooser(pendingSelection);
        } else if (markupGesture.moving) {
          marks = structuredClone(markupGesture.before);
          const mark = marks.find((candidate) => candidate.id === markupGesture.moving);
          const rect = markBounds(mark);
          const moveX = clamp(dx, pendingSelection.x - rect.x, pendingSelection.x + pendingSelection.width - rect.x - rect.width);
          const moveY = clamp(dy, pendingSelection.y - rect.y, pendingSelection.y + pendingSelection.height - rect.y - rect.height);
          const translated = (vertex) => ({ x: vertex.x + moveX, y: vertex.y + moveY });
          mark.start = translated(mark.start);
          if (mark.end) mark.end = translated(mark.end);
          if (mark.points) mark.points = mark.points.map(translated);
        } else {
          const clipped = { x: clamp(point.x, pendingSelection.x, pendingSelection.x + pendingSelection.width), y: clamp(point.y, pendingSelection.y, pendingSelection.y + pendingSelection.height) };
          markupGesture.draft.end = clipped;
          markupGesture.draft.points?.push(clipped);
        }
        renderMarkup();
      });
      const finishMarkupGesture = (event, cancelled = false) => {
        if (!markupGesture || event.pointerId !== markupGesture.pointerId) return;
        const gesture = markupGesture;
        markupGesture = null;
        if (markupCanvas.hasPointerCapture(event.pointerId)) markupCanvas.releasePointerCapture(event.pointerId);
        if (cancelled) {
          if (gesture.before) marks = gesture.before;
          if (gesture.rect) pendingSelection = gesture.rect;
        } else if (gesture.draft) {
          const rect = markBounds(gesture.draft);
          if (rect.width > 2 || rect.height > 2) {
            const before = copyMarks();
            marks.push(gesture.draft);
            saveMarkChange(before);
          }
        } else if (gesture.before && JSON.stringify(gesture.before) !== JSON.stringify(marks)) saveMarkChange(gesture.before);
        showSelection(pendingSelection);
        showChooser(pendingSelection);
        renderMarkup();
      };
      markupCanvas.addEventListener('pointerup', (event) => finishMarkupGesture(event));
      markupCanvas.addEventListener('pointercancel', (event) => finishMarkupGesture(event, true));
      window.addEventListener('resize', () => {
        if (!pendingSelection) return;
        commitText();
        showSelection(pendingSelection);
        showChooser(pendingSelection);
        renderMarkup();
      });

      const bringToFront = (card) => {
        highestLayer += 1;
        card.style.zIndex = String(highestLayer);
      };

      const refreshCardCount = () => updateDock();

      const beginCardDrag = (event, card) => {
        if (event.button !== 0) return;
        bringToFront(card);
        drag = {
          card,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          left: parseFloat(card.style.left) || 0,
          top: parseFloat(card.style.top) || 0,
        };
        event.currentTarget.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      };

      const moveCard = (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        const maxLeft = Math.max(0, stage.clientWidth - drag.card.offsetWidth);
        const maxTop = Math.max(0, stage.clientHeight - drag.card.offsetHeight);
        drag.card.style.left = `${clamp(drag.left + event.clientX - drag.startX, 0, maxLeft)}px`;
        drag.card.style.top = `${clamp(drag.top + event.clientY - drag.startY, 0, maxTop)}px`;
      };

      const finishCardDrag = (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        if (event.type === 'pointercancel') {
          drag.card.style.left = `${drag.left}px`;
          drag.card.style.top = `${drag.top}px`;
        }
        event.currentTarget.releasePointerCapture?.(event.pointerId);
        drag = null;
      };

      const createCaptureCard = (rect) => {
        const sourceBounds = source.getBoundingClientRect();
        const stageBounds = stage.getBoundingClientRect();
        const capturedCanvas = cropSelection(rect);
        const capturedSource = capturedCanvas?.toDataURL('image/png');
        const card = document.createElement('article');
        card.className = 'floating-capture';
        card.dataset.floatingCapture = 'true';
        card.tabIndex = 0;
        card.setAttribute('aria-label', '已挂起截图。拖动图片可移动；左上角红色按钮关闭；右上角可编辑、识别文字或切换置顶。');
        card.style.width = `${rect.width}px`;
        card.style.height = `${rect.height}px`;
        card.style.left = `${sourceBounds.left - stageBounds.left + rect.x}px`;
        card.style.top = `${sourceBounds.top - stageBounds.top + rect.y}px`;

        const preview = document.createElement('div');
        preview.className = 'floating-capture__preview';
        const image = new Image();
        image.src = capturedSource || sourceImage.src;
        image.alt = '';
        image.style.width = '100%';
        image.style.height = '100%';
        image.style.left = '0';
        image.style.top = '0';
        image.style.objectFit = 'fill';
        preview.appendChild(image);

        preview.setAttribute('aria-label', '拖动截图');
        preview.addEventListener('pointerdown', (event) => beginCardDrag(event, card));
        preview.addEventListener('pointermove', moveCard);
        preview.addEventListener('pointerup', finishCardDrag);
        preview.addEventListener('pointercancel', finishCardDrag);

        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'floating-capture__close';
        close.setAttribute('aria-label', '关闭这张截图');
        close.textContent = '×';
        close.addEventListener('pointerdown', (event) => event.stopPropagation());
        close.addEventListener('click', () => {
          card.remove();
          refreshCardCount();
        });

        const actions = document.createElement('div');
        actions.className = 'floating-capture__actions';

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.className = 'floating-capture__action';
        edit.setAttribute('aria-label', '打开截图编辑');
        edit.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l2.8-.7L13 5.1 10.9 3 3.7 10.2 3 13Z"></path><path d="M9.8 4.1l2.1 2.1"></path></svg><span>编辑</span>';
        edit.addEventListener('pointerdown', (event) => event.stopPropagation());
        edit.addEventListener('click', () => {
          window.CapturesPrototype?.openEditor(capturedSource || sourceImage);
        });

        const ocr = document.createElement('button');
        ocr.type = 'button';
        ocr.className = 'floating-capture__action';
        ocr.setAttribute('aria-label', '识别截图中的文字');
        ocr.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h3M3 3v3M13 3h-3M13 3v3M3 13h3M3 13v-3M13 13h-3M13 13v-3"></path><path d="M6 6.5h4M8 6.5v4"></path></svg><span>OCR</span>';
        ocr.addEventListener('pointerdown', (event) => event.stopPropagation());
        ocr.addEventListener('click', () => {
          const active = ocr.classList.toggle('is-active');
          ocr.setAttribute('aria-pressed', String(active));
          window.CapturesPrototype?.announce(active ? '原型：已请求文字识别' : '原型：已收起文字识别');
        });

        const pin = document.createElement('button');
        pin.type = 'button';
        pin.className = 'floating-capture__action';
        pin.setAttribute('aria-label', '置顶截图');
        pin.setAttribute('aria-pressed', 'false');
        pin.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l-.6 4 2.1 2v1H4.5V8l2.1-2L6 2Z"></path><path d="M8 9v5"></path></svg><span>置顶</span>';
        pin.addEventListener('pointerdown', (event) => event.stopPropagation());
        pin.addEventListener('click', () => {
          const active = pin.classList.toggle('is-active');
          pin.setAttribute('aria-pressed', String(active));
          pin.setAttribute('aria-label', active ? '取消置顶截图' : '置顶截图');
          window.CapturesPrototype?.announce(active ? '截图已置顶' : '截图将按普通窗口层级显示');
        });

        actions.append(edit, ocr, pin);
        card.append(preview, actions, close);
        card.addEventListener('pointerdown', () => bringToFront(card));
        stage.appendChild(card);
        bringToFront(card);
      };

      stage.addEventListener('pointerdown', (event) => {
        if (!selecting || event.button !== 0 || event.target.closest('[data-floating-capture], #pinNewCapture')) return;
        if (!event.target.closest('#pinSource')) return;
        const point = pointInSource(event);
        if (!point) return;
        origin = point;
        draggingSelection = true;
        stage.setPointerCapture?.(event.pointerId);
        selection.classList.remove('is-visible');
        event.preventDefault();
      });

      stage.addEventListener('pointermove', (event) => {
        if (draggingSelection && origin) {
          const point = pointInSource(event);
          if (!point) return;
          showSelection(rectFrom(origin, point));
          return;
        }
        if (!selecting || pendingSelection) return;
        if (event.target.closest('#pinSource')) {
          showSelection(fullSourceRect());
        } else {
          selection.classList.remove('is-visible');
        }
      });

      const finishSelection = (event) => {
        if (!draggingSelection || !origin) return;
        const point = pointInSource(event);
        const rect = point && rectFrom(origin, point);
        draggingSelection = false;
        origin = null;
        stage.releasePointerCapture?.(event.pointerId);
        if (!rect || rect.width < minimumSize.width || rect.height < minimumSize.height) {
          presentPostCaptureChoice(fullSourceRect());
          return;
        }
        presentPostCaptureChoice(rect);
      };

      stage.addEventListener('pointerup', finishSelection);
      stage.addEventListener('pointercancel', (event) => {
        if (!draggingSelection) return;
        draggingSelection = false;
        origin = null;
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
        selection.classList.remove('is-visible');
      });
      newCaptureButton.addEventListener('click', () => setSelecting(true));
      chooser.querySelectorAll('[data-post-capture-action]').forEach((button) => {
        button.addEventListener('click', async () => {
          if (!pendingSelection) return;
          commitText();
          const rect = pendingSelection;
          const action = button.dataset.postCaptureAction;
          if (action === 'close') {
            setSelecting(true);
            window.CapturesPrototype?.announce('已关闭这次截图，不会保存或复制');
            return;
          }
          if (action === 'edit') {
            const canvas = cropSelection(rect);
            finishPostCaptureChoice();
            window.CapturesPrototype?.openEditor(canvas?.toDataURL('image/png') || sourceImage);
            return;
          }
          if (action === 'pin') {
            createCaptureCard(rect);
            finishPostCaptureChoice();
            return;
          }
          if (action === 'save') {
            let link = null;
            try {
              const canvas = cropSelection(rect);
              const imageURL = canvas?.toDataURL('image/png');
              if (!imageURL?.startsWith('data:image/png;')) throw new Error('PNG export unavailable');
              link = document.createElement('a');
              link.href = imageURL;
              link.download = `Captures-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
              link.hidden = true;
              document.body.appendChild(link);
              link.click();
              // Browser download dispatch is the prototype's commit boundary;
              // it cannot inspect the user's download folder or browser policy.
              finishPostCaptureChoice();
              status.textContent = '已发起 PNG 下载 · 默认设置未改变';
              newCaptureButton.textContent = '再截一张';
            } catch (_) {
              markupMessage.textContent = '下载未能开始。选区和标注已保留，请重试。';
              markupMessage.hidden = false;
              showChooser(rect);
            } finally {
              link?.remove();
            }
            return;
          }
          if (action === 'copy') {
            const canvas = cropSelection(rect);
            let copied = false;
            if (canvas && navigator.clipboard?.write && window.ClipboardItem) {
              try {
                const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
                if (blob) {
                  await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                  copied = true;
                }
              } catch (_) {
                copied = false;
              }
            }
            if (pendingSelection !== rect) return;
            finishPostCaptureChoice();
            status.textContent = copied ? '这次截图已复制 · 默认设置未改变' : '原型：已选择复制 · 默认设置未改变';
            newCaptureButton.textContent = '再截一张';
            return;
          }
          if (action === 'ocr') {
            const canvas = cropSelection(rect);
            finishPostCaptureChoice();
            window.CapturesPrototype?.openEditor(canvas?.toDataURL('image/png') || sourceImage);
            window.CapturesPrototype?.announce('已进入文字识别');
            return;
          }
          if (action === 'scroll') {
            if (marks.length) return;
            const bounds = frozenSize || source.getBoundingClientRect();
            const normalizedSelection = {
              x: rect.x / bounds.width,
              y: rect.y / bounds.height,
              width: rect.width / bounds.width,
              height: rect.height / bounds.height,
            };
            finishPostCaptureChoice();
            window.CapturesPrototype?.openScroll(normalizedSelection);
          }
        });
      });
      window.addEventListener('keydown', (event) => {
        if (!pendingSelection || root.dataset.page !== 'pin') return;
        if (event.isComposing || composingText || event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
        const shortcut = event.key.toLowerCase();
        if ((event.metaKey || event.ctrlKey) && shortcut === 'z') {
          event.preventDefault();
          (event.shiftKey ? redoButton : undoButton).click();
          return;
        }
        if ((event.metaKey || event.ctrlKey) && shortcut === 's') {
          event.preventDefault();
          chooser.querySelector('[data-post-capture-action="save"]')?.click();
          return;
        }
        if (!event.metaKey && !event.ctrlKey) {
          const quickShortcut = { v: 'select', r: 'rectangle', e: 'ellipse', a: 'arrow', p: 'pencil', t: 'text', x: 'pixelate' }[shortcut];
          if (quickShortcut && !event.altKey) {
            event.preventDefault();
            chooseTool(quickShortcut);
            return;
          }
          if ((event.key === 'Backspace' || event.key === 'Delete') && selectedMark) {
            event.preventDefault();
            const before = copyMarks();
            marks = marks.filter((mark) => mark.id !== selectedMark);
            selectedMark = null;
            saveMarkChange(before);
            return;
          }
        }
        if (event.key === 'Enter' && event.target.closest('button')) return;
        const action = ((event.metaKey || event.ctrlKey) && shortcut === 'c') || event.key === 'Enter' ? 'copy' : null;
        if (action) {
          event.preventDefault();
          chooser.querySelector(`[data-post-capture-action="${action}"]`)?.click();
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          chooser.querySelector('[data-post-capture-action="close"]')?.click();
        }
      });
      window.addEventListener('captures-page-change', (event) => {
        if (event.detail?.page === 'pin') updateDock();
      });

      setSelecting(true);
    })();
  </script>
</body>
</html>
